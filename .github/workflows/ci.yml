name: Dashboard CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Security test dependencies
        run: python -m pip install cryptography PyNaCl
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Duet proxy syntax
        run: python -m py_compile duet/proxy.py
      - name: Shell script syntax
        run: |
          for script in install.sh deploy/*.sh duet/*.sh laptop/*.sh pi/*.sh home_server/*.sh; do
            bash -n "$script"
          done
      - name: JavaScript syntax
        run: |
          node --check app/web/app.js
          node --check app/web/cockpit.js
          node --check app/web/records.js
          node --check control/web/panel.js
