name: Dashboard CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Security test dependencies
        run: python -m pip install cryptography PyNaCl aiohttp obd
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Car Assistant release matches reviewed source
        run: python car_assistant/check_release.py
      - name: Duet proxy syntax
        run: python -m py_compile duet/proxy.py
      - name: Shell script syntax
        run: |
          for script in install.sh deploy/*.sh duet/*.sh laptop/*.sh pi/*.sh home_server/*.sh; do
            bash -n "$script"
          done
      - name: JavaScript syntax
        run: |
          node --check app/web/app.js
          node --check app/web/cockpit.js
          node --check app/web/records.js
          node --check control/web/panel.js
          node --check home_assistant/drive_console.js
          node --test tests/drive_console_values.test.mjs
  car-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned dependency base
        run: docker pull ghcr.io/home-assistant/home-assistant@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
      - name: Verify packaged fork without Internet access
        run: |
          docker network create --internal car-assistant-validation
          mkdir -p "$RUNNER_TEMP/car-assistant-config"
          trap 'docker network rm car-assistant-validation' EXIT
          docker run --rm --network car-assistant-validation -e CAR_DISPOSABLE_VALIDATION=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/car-assistant-config,dst=/config" \
            --entrypoint python3 \
            ghcr.io/home-assistant/home-assistant@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133 \
            /src/tests/native_offline_startup.py
