<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car radio messages</title><link rel="stylesheet" href="/radio-messages.css"><script defer src="/radio-messages.js"></script></head><body class="radio-shell"><section class="radio-messages" data-radio-messages><header><p class="radio-eyebrow">PRIVATE CAR NETWORK</p><h1>Radio messages</h1><p>Encrypted messages that stay queued when the connection drops.</p></header>
<div class="radio-layout"><section class="radio-compose"><h2>New message</h2><form id="messageForm"><label>To<select id="messageDestination"><option value="home">Home</option></select></label><label>Message<textarea id="messageText" rows="5" required placeholder="Write a short message…"></textarea></label><p id="messageBytes">0 / 240 bytes</p><button id="sendMessage" type="submit">Queue message</button><button id="requestStatus" type="button">Request health status</button></form><p id="messageNotice" role="status" aria-live="polite"></p><p class="radio-help">Delivered means saved by the recipient, not read. Cancelling stops local retries; transmitted data cannot be recalled.</p></section>
<section class="radio-inbox"><div id="messageCounts" class="radio-counts"></div><div class="radio-tools"><label>Show<select id="messageFilter"><option value="all">All messages</option><option value="received">Received</option><option value="sent">Sent</option><option value="queued">Waiting for delivery</option><option value="cancelled">Cancelled</option></select></label><label>Search<input id="messageSearch" type="search" placeholder="Find a message"></label><button id="refreshMessages">Refresh</button></div><p id="messageConnection" role="status"></p><div id="messageList" aria-live="polite"></div></section></div></section><p class="radio-back"><a href="/">Return to dashboard</a></p></body></html>
